    <link id="hljs-theme" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css">
    <script>
      // Anti-flicker: set dark class before paint
      (function() {
        var theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
          var link = document.getElementById('hljs-theme');
          if (link) link.href = 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css';
        }
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #ffffff;
        color: #1a1a1a;
        margin: 0;
        overflow-x: hidden;
        min-height: 100vh;
      }
      .dark body {
        background-color: #030712;
        color: #f3f4f6;
      }

      .font-display {
        font-family: 'Source Serif 4', Georgia, serif;
      }

      ::-webkit-scrollbar {
        width: 5px;
      }
      ::-webkit-scrollbar-track {
        background: #f5f5f5;
      }
      ::-webkit-scrollbar-thumb {
        background: #d1d5db;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #9ca3af;
      }
      .dark ::-webkit-scrollbar-track {
        background: #1f2937;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #4b5563;
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: #6b7280;
      }

      ::selection {
        background-color: #0d9488;
        color: #ffffff;
      }
      .dark ::selection {
        background-color: #14b8a6;
        color: #030712;
      }

      .theme-transition,
      .theme-transition *,
      .theme-transition *::before,
      .theme-transition *::after {
        transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease !important;
      }

      /* Dark prose overrides for blog content */
      .dark .prose {
        --tw-prose-body: #d1d5db;
        --tw-prose-headings: #f3f4f6;
        --tw-prose-links: #2dd4bf;
        --tw-prose-bold: #f3f4f6;
        --tw-prose-counters: #9ca3af;
        --tw-prose-bullets: #6b7280;
        --tw-prose-hr: #374151;
        --tw-prose-quotes: #d1d5db;
        --tw-prose-quote-borders: #14b8a6;
        --tw-prose-captions: #9ca3af;
        --tw-prose-code: #f3f4f6;
        --tw-prose-pre-code: #d1d5db;
        --tw-prose-pre-bg: #111827;
        --tw-prose-th-borders: #4b5563;
        --tw-prose-td-borders: #374151;
      }

      .welcome-fade {
        animation: welcome-up 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }
      @keyframes welcome-up {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .snap-container {
        scroll-snap-type: y proximity;
      }
      .snap-section {
        scroll-snap-align: start;
      }

      .scroll-indicator {
        animation: bounce-down 2s ease-in-out infinite;
      }
      @keyframes bounce-down {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(8px); }
      }

      .scroll-section {
        opacity: 0;
        transform: translateY(40px);
        transition: opacity 0.8s cubic-bezier(0.2, 0.8, 0.2, 1),
                    transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .scroll-section.scroll-visible {
        opacity: 1;
        transform: translateY(0);
      }

      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

      @keyframes marquee-left {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }

      .line-clamp-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
    </style>
</head>
<body>
    <div id="root"></div>

</body>
